<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Project 1</title>
    <link href="css/styles.css" rel="stylesheet" media="screen">
</head>
<body>
    <div id="page">
        <div id="main_content">
            <section id="home">
                <div id="container" class="container">
                    <div class="image_wrapper">
                        <!-- Wrap kia.png image in an anchor tag to link to fixed.html -->
                        <a href="kia.html"><img id="pic1" src="images/kia.png" alt=""></a>
                        <a href="samsung.html"><img id="pic2" src="images/samsung.png" alt=""></a>
                        <a href="lg.html"><img id="pic3" src="images/lg.png" alt=""></a>
                        <a href="doosan.html"><img id="pic4" src="images/doosan.png" alt=""></a>
                        <a href="kt.html"><img id="pic5" src="images/kt.png" alt=""></a>
                        <a href="lotte.html"><img id="pic6" src="images/lotte.png" alt=""></a>
                    </div>

                    <!-- Navigation -->
                    <div class="next"></div>
                    <div class="prev"></div>

                    <!-- Thumbnail navigation -->
                    <ul class="nav">
                        <li id="nav1" class="selected"><a class="thumbnav" href="images/kia.jpg" rel="images/thumbs/kia.png">Image 1</a></li>
                        <li id="nav2" class="selected"><a class="thumbnav" href="images/samsung.png" rel="images/thumbs/samsung.png">Image 2</a></li>
                        <li id="nav3" class="selected"><a class="thumbnav" href="images/lg.png" rel="images/thumbs/lg.png">Image 3</a></li>
                        <li id="nav4" class="selected"><a class="thumbnav" href="images/doosan.png" rel="images/thumbs/doosan.png">Image 4</a></li>
                        <li id="nav5" class="selected"><a class="thumbnav" href="images/kt.png" rel="images/thumbs/kt.png">Image 5</a></li>
                        <li id="nav6" class="selected"><a class="thumbnav" href="images/lotte.png" rel="images/thumbs/lotte.png">Image 6</a></li>
                        <li class="preview">
                            <div class="preview_wrapper"></div>
                            <span></span>
                        </li>
                    </ul>
                </div>
                <!-- <a href="../Part2/index.html">To Part 2</a> -->

                <script type="text/javascript" src="js/jquery-3.7.1.min.js"></script>
                <script type="text/javascript">
                    $(document).ready(function() {
                        var counter = 1;
                        var move = 650; // Assuming each image width is 650px

                        // Thumbnail hover preview
                        $("a.thumbnav").hover(function() {
                            var rel = $(this).attr("rel"); // Get the thumbnail URL
                            var dotPosition = $(this).parent().position().left; // Get the position of the hovered dot

                            // Set the background of the preview and position it
                            $("li.preview .preview_wrapper").css({
                                "background": "url(" + rel + ") no-repeat center",
                                "background-size": "contain"
                            });

                            // Adjust the left position dynamically
                            $("li.preview").css({
                                "display": "block",
                                "left": dotPosition - 30 + "px" // Adjust based on the position of the dot
                            });
                        }, function() {
                            // Hide the preview when not hovering
                            $("li.preview").css("display", "none");
                        });

                        // Thumbnail navigation click
                        $("a.thumbnav").click(function(event) {
                            event.preventDefault();
                            var ref = $(this).attr("href");

                            var imgNum = parseInt(ref.match(/\d/)[0]);
                            var distance = (imgNum - counter) * move;
                            var direction = distance < 0 ? "+=" : "-=";

                            $(".image_wrapper img").animate({
                                left: direction + Math.abs(distance)
                            }, 250);

                            counter = imgNum;
                            $("li.selected").removeClass("selected");
                            $("#nav" + imgNum).addClass("selected");
                        });

                        // Next button
                        $(".next").click(function() {
                            if (counter < 6) { // Only go up to 6
                                $(".image_wrapper img").animate({
                                    left: "-=" + move
                                }, 250);
                                counter++;
                                $("li.selected").removeClass("selected");
                                $("#nav" + counter).addClass("selected");
                            } else {
                                $(".image_wrapper img").animate({
                                    left: "+=" + move * 5
                                }, 250);
                                counter = 1;
                                $("li.selected").removeClass("selected");
                                $("#nav" + counter).addClass("selected");
                            }
                        });

                        // Previous button
                        $(".prev").click(function() {
                            if (counter > 1) {
                                $(".image_wrapper img").animate({
                                    left: "+=" + move
                                }, 250);
                                counter--;
                                $("li.selected").removeClass("selected");
                                $("#nav" + counter).addClass("selected");
                            } else {
                                $(".image_wrapper img").animate({
                                    left: "-=" + move * 5
                                }, 250);
                                counter = 6;
                                $("li.selected").removeClass("selected");
                                $("#nav" + counter).addClass("selected");
                            }
                        });
                    });
                </script>
                
            </section>
        </div>
    </div>
</body>
</html>
